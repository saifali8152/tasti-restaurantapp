name: tasti_restaurant_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.13+14

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  http: ^1.5.0
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  qr_flutter: ^4.1.0
  pie_chart: ^5.3.2
  percent_indicator: ^4.2.2
  cupertino_icons: ^1.0.8
  flutter_lints: ^5.0.0
  intl: ^0.19.0
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0
  meta: ^1.15.0
  another_flushbar: ^1.12.30
  flutter_secure_storage: ^9.2.4
  dotted_border: ^2.1.0
  image_picker: ^1.1.2
  get_it: ^8.0.3
  dio: ^5.8.0+1
  intl_phone_field: ^3.2.0
  equatable: ^2.0.7
  carousel_slider: ^5.0.0
  shimmer: ^3.0.0
  webview_flutter: ^4.13.0
  share_plus: ^11.0.0
  screenshot: ^3.0.0
  saver_gallery: ^4.0.1
  permission_handler: ^12.0.1
  syncfusion_flutter_pdfviewer: ^29.2.11
  file_picker: ^10.2.4
  csv: ^6.0.0
  path_provider: ^2.1.5
  icons_launcher: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.1


# 🚀 icons_launcher configuration
icons_launcher:
  image_path: "assets/icons/launcher.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true


flutter_native_splash:
  color: "#ffffff"   # white background
  image: assets/icons/launcher.png   # your logo
  android: true
  ios: true


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
